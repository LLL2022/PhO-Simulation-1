<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Physics Olympiad Simulation Lab</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1117;
    color: #e8eaf0;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header {
    border-bottom: 1px solid #2a2f3a;
    flex-shrink: 0;
    padding: 0.65rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: 0.01em; }
  nav.parts { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
  .part-tab {
    padding: 0.4rem 0.95rem;
    font-size: 0.82rem;
    border-radius: 999px;
    border: 1px solid #3b4252;
    background: transparent;
    color: #c8cfda;
    cursor: pointer;
    font-family: inherit;
  }
  .part-tab:hover:not(:disabled) { background: #1f2530; }
  .part-tab.active {
    background: #1f3a5f;
    border-color: #3b6ea5;
    color: #cfe3ff;
  }
  .part-tab:disabled,
  .part-tab.soon {
    opacity: 0.4;
    cursor: not-allowed;
    border-style: dashed;
  }
  .part-tab.soon::after {
    content: ' (soon)';
    font-size: 0.72em;
    color: #8b93a1;
  }
  nav.parts .divider {
    width: 1px;
    align-self: stretch;
    margin: 0.1rem 0.4rem;
    background: #2a2f3a;
  }
  main {
    display: grid;
    grid-template-columns: 1fr 340px;
    flex: 1;
    min-height: 0;
  }
  main[hidden] { display: none !important; }
  .canvas-wrap {
    position: relative;
    background: #0b0d12;
    border-right: 1px solid #2a2f3a;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #simCanvasA { cursor: crosshair; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(15, 17, 23, 0.96);
    border: 1px solid #3b6ea5;
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    font-family: ui-monospace, monospace;
    font-size: 0.78rem;
    color: #e8eaf0;
    line-height: 1.5;
    display: none;
    z-index: 10;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .tooltip-title { color: #6ea8fe; margin-bottom: 2px; }
  .tooltip .hl { color: #ffd166; }
  .panel {
    padding: 1rem 1.15rem 2rem;
    overflow-y: auto;
    background: #151922;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .panel button {
    padding: 0.5rem 0.9rem;
    border-radius: 6px;
    border: 1px solid #3b4252;
    background: #1f2530;
    color: #c8cfda;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .panel button:hover:not(:disabled) { background: #2a3140; }
  .panel button.primary {
    background: #1f3a5f;
    border-color: #3b6ea5;
    color: #cfe3ff;
  }
  .panel button.primary:hover:not(:disabled) { background: #264a78; }
  .panel button:disabled { opacity: 0.4; cursor: not-allowed; }
  .control-row { display: flex; gap: 0.5rem; }
  .control-row button { flex: 1; }
  .readout {
    font-family: ui-monospace, monospace;
    font-size: 0.82rem;
    color: #9aa4b2;
    line-height: 1.7;
    min-height: 1.5em;
  }
  .readout .hl { color: #ffd166; }
  .readout .err { color: #e88b8b; }
  .dim-row { display: flex; gap: 0.35rem; }
  .dim-btn {
    flex: 1;
    padding: 0.5rem 0.6rem !important;
    font-size: 0.85rem;
  }
  .dim-btn.active {
    background: #1f3a5f;
    border-color: #3b6ea5;
    color: #cfe3ff;
  }
  .panel label {
    display: block;
    font-size: 0.72rem;
    color: #8b93a1;
    margin: 0.4rem 0 0.3rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .panel input[type="text"] {
    width: 100%;
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    border: 1px solid #3b4252;
    background: #0f1117;
    color: #e8eaf0;
    font-size: 0.9rem;
    font-family: ui-monospace, monospace;
    outline: none;
  }
  .panel input[type="text"]:focus { border-color: #3b6ea5; }

  main.simple-view {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0d12;
    padding: 2rem;
  }
  .simple-card {
    width: 100%;
    max-width: 480px;
    background: #151922;
    border: 1px solid #2a2f3a;
    border-radius: 10px;
    padding: 1.5rem 1.75rem 1.75rem;
    max-height: 100%;
    overflow-y: auto;
  }
  .simple-card h2 {
    margin: 0 0 1.1rem;
    font-size: 1rem;
    font-weight: 600;
    color: #cfe3ff;
    letter-spacing: 0.01em;
  }
  .simple-card label {
    display: block;
    font-size: 0.72rem;
    color: #8b93a1;
    margin: 0.9rem 0 0.35rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .simple-card input[type="text"] {
    width: 100%;
    padding: 0.55rem 0.7rem;
    border-radius: 6px;
    border: 1px solid #3b4252;
    background: #0f1117;
    color: #e8eaf0;
    font-size: 1rem;
    font-family: ui-monospace, monospace;
    outline: none;
  }
  .simple-card input[type="text"]:focus { border-color: #3b6ea5; }
  .simple-card .button-row {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  .simple-card .button-row button {
    flex: 1;
    padding: 0.55rem 0.9rem;
    border-radius: 6px;
    border: 1px solid #3b4252;
    background: #1f2530;
    color: #c8cfda;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .simple-card .button-row button:hover:not(:disabled) { background: #2a3140; }
  .simple-card .button-row button.primary {
    background: #1f3a5f;
    border-color: #3b6ea5;
    color: #cfe3ff;
  }
  .simple-card .button-row button.primary:hover:not(:disabled) { background: #264a78; }
  .simple-card .result {
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid #2a2f3a;
    font-family: ui-monospace, monospace;
    font-size: 0.9rem;
    line-height: 1.8;
    color: #9aa4b2;
    min-height: 3.5em;
  }
  .simple-card .result .value {
    font-size: 1.6rem;
    color: #ffd166;
    font-weight: 500;
  }
  .simple-card .result .err { color: #e88b8b; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
    .canvas-wrap { border-right: none; border-bottom: 1px solid #2a2f3a; }
  }
</style>
</head>
<body>

<header>
  <h1>Physics Olympiad Simulation Lab</h1>
  <nav class="parts">
    <button class="part-tab active" data-part="1A">1A · 2D Random Walk</button>
    <button class="part-tab" data-part="1B">1B · Lattice Walk</button>
    <button class="part-tab" data-part="1C">1C · Self-Avoiding Walk</button>
    <button class="part-tab soon" disabled>1D</button>
    <span class="divider"></span>
    <button class="part-tab" data-part="2A">2A · Shadow Length</button>
    <button class="part-tab" data-part="2B">2B · Shadow Area</button>
    <button class="part-tab soon" disabled>2C</button>
  </nav>
</header>

<!-- ============================ 1A ============================ -->
<main id="viewA">
  <section class="canvas-wrap">
    <canvas id="simCanvasA"></canvas>
    <div id="tooltipA" class="tooltip"></div>
  </section>
  <aside class="panel" id="panelA">
    <div class="control-row">
      <button id="runBtnA" class="primary">New Run</button>
      <button id="clearBtnA">Clear All</button>
    </div>
    <div class="control-row">
      <button id="recenterBtnA">Recenter View</button>
    </div>
    <div class="readout">
      Runs completed: <span class="hl" id="runCountA">0</span><br>
      <span id="liveTextA">Click "New Run" to begin.</span>
    </div>
  </aside>
</main>

<!-- ============================ 1B ============================ -->
<main id="viewB" hidden>
  <section class="canvas-wrap">
    <canvas id="simCanvasB"></canvas>
  </section>
  <aside class="panel" id="panelB">
    <div class="dim-row">
      <button class="dim-btn" data-d="1">1D</button>
      <button class="dim-btn active" data-d="2">2D</button>
      <button class="dim-btn" data-d="3">3D</button>
    </div>
    <label for="nInput">Steps N</label>
    <input id="nInput" type="text" inputmode="numeric" autocomplete="off"
           spellcheck="false" value="1000">
    <div class="control-row">
      <button id="runBtnB" class="primary">Run</button>
      <button id="clearBtnB">Clear</button>
    </div>
    <div class="readout" id="readoutB">Ready.</div>
  </aside>
</main>

<!-- ============================ 1C ============================ -->
<main id="viewC" hidden>
  <section class="canvas-wrap">
    <canvas id="simCanvasC"></canvas>
  </section>
  <aside class="panel" id="panelC">
    <label for="cInput">Steps N</label>
    <input id="cInput" type="text" inputmode="numeric" autocomplete="off"
           spellcheck="false" value="1000">
    <div class="control-row">
      <button id="runBtnC" class="primary">Run</button>
      <button id="clearBtnC">Clear</button>
    </div>
    <div class="readout" id="readoutC">Ready.</div>
  </aside>
</main>

<!-- ============================ 2A ============================ -->
<main id="view2A" hidden class="simple-view">
  <div class="simple-card">
    <h2>2A · Shadow Length</h2>

    <label for="hInput2A">Height h (cm)</label>
    <input id="hInput2A" type="text" inputmode="decimal"
           autocomplete="off" spellcheck="false" value="10">

    <div class="button-row">
      <button id="runBtn2A" class="primary">Run Simulation</button>
    </div>

    <div class="result" id="readout2A">Enter a height and press Run Simulation.</div>
  </div>
</main>

<!-- ============================ 2B ============================ -->
<main id="view2B" hidden class="simple-view">
  <div class="simple-card">
    <h2>2B · Shadow Area</h2>

    <label for="xInput2B">Sphere center x (cm)</label>
    <input id="xInput2B" type="text" autocomplete="off" spellcheck="false" value="0">

    <label for="yInput2B">Sphere center y (cm)</label>
    <input id="yInput2B" type="text" autocomplete="off" spellcheck="false" value="0">

    <label for="zInput2B">Sphere center z (cm), 20 &lt; z &lt; 80</label>
    <input id="zInput2B" type="text" autocomplete="off" spellcheck="false" value="50">

    <div class="button-row">
      <button id="runBtn2B" class="primary">Compute Shadow Area</button>
    </div>

    <div class="result" id="readout2B">Place the sphere and press Compute.</div>
  </div>
</main>

<script>
/* =====================================================
   Tab switching
   ===================================================== */
(function () {
  const tabs = document.querySelectorAll('.part-tab[data-part]');
  const views = {
    '1A': document.getElementById('viewA'),
    '1B': document.getElementById('viewB'),
    '1C': document.getElementById('viewC'),
    '2A': document.getElementById('view2A'),
    '2B': document.getElementById('view2B'),
  };

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      if (tab.disabled) return;
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const part = tab.dataset.part;
      for (const k in views) views[k].hidden = (k !== part);
    });
  });
})();
</script>

<script>
/* =====================================================
   1A · 2D Random Walk
   ===================================================== */
(function () {
  const canvas  = document.getElementById('simCanvasA');
  const ctx     = canvas.getContext('2d');
  const tooltip = document.getElementById('tooltipA');
  const COLORS = [
    '#6ea8fe', '#8bc9a0', '#ffd166', '#e88b8b', '#c8a2ff',
    '#7fd4d4', '#f0a860', '#a0d860', '#d47fb8', '#8fa0e8',
  ];
  const PHYS = { v: 4.11, dt: 0.01, T: 10 };
  const S = { runs: [], current: null, acc: 0, running: false, hover: null };
  const view = { cx: 0, cy: 0, scale: 50, panX: 0, panY: 0 };

  function syncCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (cw === 0 || ch === 0) return false;
    const tw = Math.round(cw * dpr), th = Math.round(ch * dpr);
    if (canvas.width !== tw || canvas.height !== th) {
      canvas.width = tw; canvas.height = th;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      view.cx = cw / 2; view.cy = ch / 2;
      view.scale = Math.min(cw, ch) / 4;
    }
    return true;
  }
  function w2s(x, y) {
    return [view.cx + x * view.scale + view.panX, view.cy - y * view.scale + view.panY];
  }
  function s2w(sx, sy) {
    return [(sx - view.cx - view.panX) / view.scale, (view.cy + view.panY - sy) / view.scale];
  }
  function newRun() {
    const id = S.runs.length + 1;
    S.current = {
      id, color: COLORS[(id - 1) % COLORS.length],
      t: 0, steps: 0, x: 0, y: 0,
      path: [[0, 0]], markers: [{ t: 0, x: 0, y: 0 }], done: false,
    };
    S.acc = 0; S.running = true;
    updateLiveReadout(); updateRunButton();
  }
  function stepOnce() {
    const c = S.current;
    if (!c) return;
    c.steps++;
    const th = Math.random() * Math.PI * 2;
    c.x += PHYS.v * PHYS.dt * Math.cos(th);
    c.y += PHYS.v * PHYS.dt * Math.sin(th);
    c.path.push([c.x, c.y]);
    const tNow = c.steps * PHYS.dt;
    c.t = tNow;
    const nextSec = c.markers.length;
    if (nextSec <= PHYS.T && tNow + 1e-9 >= nextSec) {
      c.markers.push({ t: nextSec, x: c.x, y: c.y });
    }
    if (tNow + 1e-9 >= PHYS.T) {
      c.t = PHYS.T; c.done = true;
      S.runs.push(c); S.current = null; S.running = false;
      updateRunButton(); updateLiveReadout();
    }
  }
  let lastFrame = performance.now();
  function loop(now) {
    const dtReal = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;
    const ok = syncCanvas();
    if (ok && S.running && S.current && !document.getElementById('viewA').hidden) {
      S.acc += dtReal;
      let guard = 0;
      while (S.acc >= PHYS.dt && S.current && guard++ < 20000) {
        stepOnce(); S.acc -= PHYS.dt;
      }
      const tEl = document.getElementById('tNowA');
      if (tEl && S.current) tEl.textContent = S.current.t.toFixed(2);
    }
    render();
    requestAnimationFrame(loop);
  }
  function render() {
    if (document.getElementById('viewA').hidden) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w === 0 || h === 0) return;
    ctx.clearRect(0, 0, w, h);
    drawGrid(); drawAllRuns(); drawOrigin(); drawHoverRing(); drawOverlay();
  }
  function drawGrid() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const step = 0.5;
    const [xMinW, yMaxW] = s2w(0, 0);
    const [xMaxW, yMinW] = s2w(w, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const xStart = Math.floor(xMinW / step) * step;
    for (let x = xStart; x <= xMaxW + 1e-9; x += step) {
      const [sx] = w2s(x, 0);
      ctx.moveTo(sx, 0); ctx.lineTo(sx, h);
    }
    const yStart = Math.floor(yMinW / step) * step;
    for (let y = yStart; y <= yMaxW + 1e-9; y += step) {
      const [, sy] = w2s(0, y);
      ctx.moveTo(0, sy); ctx.lineTo(w, sy);
    }
    ctx.stroke();
  }
  function drawAllRuns() {
    for (let i = 0; i < S.runs.length - 1; i++) drawRunPath(S.runs[i], 0.18);
    if (S.runs.length > 0) {
      const last = S.runs[S.runs.length - 1];
      drawRunPath(last, 0.55); drawRunMarkers(last, 3.5);
    }
    if (S.current) { drawRunPath(S.current, 1.0); drawRunMarkers(S.current, 4.5); }
  }
  function drawRunPath(run, alpha) {
    if (run.path.length < 2) return;
    ctx.beginPath();
    const [sx0, sy0] = w2s(run.path[0][0], run.path[0][1]);
    ctx.moveTo(sx0, sy0);
    for (let i = 1; i < run.path.length; i++) {
      const [sx, sy] = w2s(run.path[i][0], run.path[i][1]);
      ctx.lineTo(sx, sy);
    }
    ctx.strokeStyle = hexWithAlpha(run.color, alpha);
    ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.stroke();
  }
  function drawRunMarkers(run, r) {
    for (const m of run.markers) {
      const [sx, sy] = w2s(m.x, m.y);
      ctx.beginPath();
      ctx.arc(sx, sy, m.t === 0 ? r + 1.5 : r, 0, Math.PI * 2);
      ctx.fillStyle = m.t === 0 ? '#ffd166' : run.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  function drawOrigin() {
    const [ox, oy] = w2s(0, 0);
    ctx.beginPath(); ctx.arc(ox, oy, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd166'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,209,102,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ox - 8, oy); ctx.lineTo(ox + 8, oy);
    ctx.moveTo(ox, oy - 8); ctx.lineTo(ox, oy + 8);
    ctx.stroke();
  }
  function drawHoverRing() {
    if (!S.hover) return;
    const [sx, sy] = w2s(S.hover.x, S.hover.y);
    ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  function drawOverlay() {
    ctx.font = '12px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(200,207,218,0.75)';
    ctx.fillText('Runs completed: ' + S.runs.length, 14, 22);
    if (S.current) {
      ctx.fillStyle = 'rgba(255,209,102,0.9)';
      ctx.fillText('t = ' + S.current.t.toFixed(2) + ' s', 14, 42);
    }
  }
  function hexWithAlpha(hex, alpha) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    panStartX = view.panX; panStartY = view.panY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (dragging) {
      view.panX = panStartX + (e.clientX - dragStartX);
      view.panY = panStartY + (e.clientY - dragStartY);
      S.hover = null; tooltip.style.display = 'none';
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const hoverable = [];
    if (S.current) hoverable.push(S.current);
    if (S.runs.length > 0) hoverable.push(S.runs[S.runs.length - 1]);
    let best = null, bestDist = 16;
    for (const run of hoverable) {
      for (const m of run.markers) {
        const [sx, sy] = w2s(m.x, m.y);
        const d = Math.hypot(sx - mx, sy - my);
        if (d < bestDist) { bestDist = d; best = { ...m, runId: run.id, sx, sy }; }
      }
    }
    S.hover = best; updateTooltip();
  });
  canvas.addEventListener('pointerup', (e) => {
    dragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('pointercancel', () => { dragging = false; });
  canvas.addEventListener('pointerleave', () => {
    if (dragging) return;
    S.hover = null; updateTooltip();
  });
  function updateTooltip() {
    if (!S.hover) { tooltip.style.display = 'none'; return; }
    tooltip.style.display = 'block';
    tooltip.style.left = (S.hover.sx + 14) + 'px';
    tooltip.style.top  = (S.hover.sy + 10) + 'px';
    tooltip.innerHTML =
      '<div class="tooltip-title">Run ' + S.hover.runId + ' \u00B7 t = ' + S.hover.t + ' s</div>' +
      '<div>x = <span class="hl">' + S.hover.x.toFixed(4) + '</span></div>' +
      '<div>y = <span class="hl">' + S.hover.y.toFixed(4) + '</span></div>';
  }
  document.getElementById('runBtnA').addEventListener('click', () => {
    if (S.running && S.current) { S.running = false; updateRunButton(); }
    else if (S.current && !S.current.done) { S.running = true; updateRunButton(); }
    else { newRun(); updateRunButton(); }
  });
  document.getElementById('clearBtnA').addEventListener('click', () => {
    S.runs = []; S.current = null; S.running = false; S.hover = null;
    tooltip.style.display = 'none';
    updateRunButton(); updateLiveReadout();
  });
  document.getElementById('recenterBtnA').addEventListener('click', () => {
    view.panX = 0; view.panY = 0;
  });
  function updateRunButton() {
    const b = document.getElementById('runBtnA');
    if (S.running && S.current) b.textContent = 'Pause';
    else if (S.current && !S.current.done) b.textContent = 'Continue';
    else b.textContent = 'New Run';
  }
  function updateLiveReadout() {
    const rc = document.getElementById('runCountA');
    if (rc) rc.textContent = S.runs.length;
    const live = document.getElementById('liveTextA');
    if (!live) return;
    if (S.current) {
      live.innerHTML = 'Current run ' + S.current.id +
        ': t = <span class="hl" id="tNowA">' + S.current.t.toFixed(2) + '</span> s';
    } else if (S.runs.length === 0) {
      live.textContent = 'Click "New Run" to begin.';
    } else {
      live.textContent = 'Latest: run #' + S.runs.length + ' complete.';
    }
  }
  window.addEventListener('resize', syncCanvas);
  syncCanvas(); updateLiveReadout();
  requestAnimationFrame(loop);
})();
</script>

<script>
/* =====================================================
   1B · Lattice Random Walk
   ===================================================== */
(function () {
  const canvas    = document.getElementById('simCanvasB');
  const ctx       = canvas.getContext('2d');
  const readoutEl = document.getElementById('readoutB');
  const MAX_N = 1000000;
  const MAX_DRAWN_POINTS = 5000;
  const RATE_C = 2;
  const S = { d: 2, N: 1000, anim: null, last: null, stepAcc: 0, inputValid: true };

  function syncCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (cw === 0 || ch === 0) return false;
    const tw = Math.round(cw * dpr), th = Math.round(ch * dpr);
    if (canvas.width !== tw || canvas.height !== th) {
      canvas.width = tw; canvas.height = th;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return true;
  }
  function parseN(raw) {
    const s = String(raw).trim();
    if (s.length === 0) return null;
    const n = parseInt(s, 10);
    if (!Number.isFinite(n)) return null;
    if (n < 1 || n > MAX_N) return null;
    return n;
  }
  function applyValidation() {
    const raw = document.getElementById('nInput').value;
    const n = parseN(raw);
    S.inputValid = (n !== null);
    if (n !== null) S.N = n;
    const runBtn = document.getElementById('runBtnB');
    if (!S.anim) runBtn.disabled = !S.inputValid;
    if (!S.inputValid) {
      readoutEl.innerHTML = '<span class="err">Enter a positive integer up to ' + MAX_N.toLocaleString() + '.</span>';
    } else if (!S.anim) {
      if (S.last) {
        readoutEl.innerHTML = 'Last run: d=' + S.last.d + ', N=' + S.last.N + ', returns=<span class="hl">' + S.last.returns + '</span>';
      } else { readoutEl.textContent = 'Ready.'; }
    }
  }
  function randomUnitVector(d) {
    const k = Math.floor(Math.random() * 2 * d);
    const axis = Math.floor(k / 2);
    const sign = (k % 2 === 0) ? 1 : -1;
    const v = new Array(d).fill(0);
    v[axis] = sign;
    return v;
  }
  function createWalk(d, N) {
    return {
      d: d, N: N,
      pos: new Array(d).fill(0),
      path: [new Array(d).fill(0)],
      returns: 0, returnSteps: [], stepIdx: 0, done: false,
    };
  }
  function advanceWalk(w) {
    if (w.done) return;
    const step = randomUnitVector(w.d);
    for (let k = 0; k < w.d; k++) w.pos[k] += step[k];
    w.path.push([...w.pos]);
    w.stepIdx++;
    if (w.pos.every(v => v === 0)) { w.returns++; w.returnSteps.push(w.stepIdx); }
    if (w.stepIdx >= w.N) w.done = true;
  }
  function tracePath(walk, toScreen) {
    const path = walk.path;
    const L = path.length;
    const stride = Math.max(1, Math.floor(L / MAX_DRAWN_POINTS));
    const [x0, y0] = toScreen(path[0]);
    ctx.beginPath(); ctx.moveTo(x0, y0);
    for (let i = stride; i < L; i += stride) {
      const [sx, sy] = toScreen(path[i]);
      ctx.lineTo(sx, sy);
    }
    if ((L - 1) % stride !== 0) {
      const [sx, sy] = toScreen(path[L - 1]);
      ctx.lineTo(sx, sy);
    }
  }
  function render() {
    if (document.getElementById('viewB').hidden) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w === 0 || h === 0) return;
    ctx.clearRect(0, 0, w, h);
    const walk = S.anim || S.last;
    if (!walk) {
      ctx.fillStyle = 'rgba(200,207,218,0.4)';
      ctx.font = '14px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Press Run to begin.', w / 2, h / 2);
      return;
    }
    if (walk.d === 1) render1D(walk);
    else if (walk.d === 2) render2D(walk);
    else render3D(walk);
    drawOverlay(walk);
  }
  function render1D(walk) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const padL = 70, padR = 40, padT = 40, padB = 40;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    let maxAbs = Math.max(1, Math.sqrt(walk.N) * 2);
    for (const p of walk.path) maxAbs = Math.max(maxAbs, Math.abs(p[0]) * 1.15);
    const cy0 = padT + plotH / 2;
    const mapX = n => padL + (n / walk.N) * plotW;
    const mapY = x => cy0 - (x / maxAbs) * (plotH / 2);
    ctx.strokeStyle = 'rgba(200,207,218,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, cy0); ctx.lineTo(padL + plotW, cy0);
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH);
    ctx.stroke();
    ctx.fillStyle = 'rgba(200,207,218,0.55)';
    ctx.font = '11px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('0', padL, cy0 + 15);
    ctx.fillText(walk.N.toString(), padL + plotW, cy0 + 15);
    ctx.textAlign = 'right';
    ctx.fillText('+' + maxAbs.toFixed(0), padL - 6, padT + 12);
    ctx.fillText('0', padL - 6, cy0 + 4);
    ctx.fillText('-' + maxAbs.toFixed(0), padL - 6, padT + plotH + 4);
    const L = walk.path.length;
    const stride = Math.max(1, Math.floor(L / MAX_DRAWN_POINTS));
    ctx.beginPath();
    ctx.moveTo(mapX(0), mapY(walk.path[0][0]));
    for (let i = stride; i < L; i += stride) ctx.lineTo(mapX(i), mapY(walk.path[i][0]));
    if ((L - 1) % stride !== 0) ctx.lineTo(mapX(L - 1), mapY(walk.path[L - 1][0]));
    ctx.strokeStyle = '#6ea8fe'; ctx.lineWidth = 1.2; ctx.stroke();
    for (const step of walk.returnSteps) {
      ctx.beginPath(); ctx.arc(mapX(step), mapY(0), 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd166'; ctx.fill();
    }
    if (S.anim && !S.anim.done) {
      ctx.beginPath(); ctx.arc(mapX(walk.stepIdx), mapY(walk.pos[0]), 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
    }
  }
  function render2D(walk) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const cx = w / 2, cy = h / 2;
    let maxR = 1;
    for (const p of walk.path) {
      const r = Math.hypot(p[0], p[1]);
      if (r > maxR) maxR = r;
    }
    maxR *= 1.1;
    const scale = Math.min(w, h) / (2 * maxR);
    const toScreen = (p) => [cx + p[0] * scale, cy - p[1] * scale];
    const w2s = (x, y) => [cx + x * scale, cy - y * scale];
    const spacing = niceGridSpacing(maxR);
    const nGrid = Math.ceil(maxR / spacing) + 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = -nGrid; i <= nGrid; i++) {
      const [sx] = w2s(i * spacing, 0);
      ctx.moveTo(sx, 0); ctx.lineTo(sx, h);
      const [, sy] = w2s(0, i * spacing);
      ctx.moveTo(0, sy); ctx.lineTo(w, sy);
    }
    ctx.stroke();
    tracePath(walk, toScreen);
    ctx.strokeStyle = 'rgba(110,168,254,0.85)'; ctx.lineWidth = 1.2;
    ctx.lineJoin = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd166'; ctx.fill();
    if (S.anim && !S.anim.done) {
      const [px, py] = w2s(walk.pos[0], walk.pos[1]);
      ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
    }
  }
  function render3D(walk) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const cx = w / 2, cy = h / 2;
    const cos30 = Math.cos(Math.PI / 6), sin30 = 0.5;
    const proj = (p) => [(p[0] - p[2]) * cos30, (p[0] + p[2]) * sin30 - p[1]];
    let maxIso = 1;
    for (const p of walk.path) {
      const [ix, iy] = proj(p);
      const r = Math.hypot(ix, iy);
      if (r > maxIso) maxIso = r;
    }
    maxIso *= 1.1;
    const scale = Math.min(w, h) / (2 * maxIso);
    const toScreen = (p) => { const [ix, iy] = proj(p); return [cx + ix * scale, cy - iy * scale]; };
    const w2s = toScreen;
    const axisLen = maxIso * 0.55;
    const drawAxis = (vec, color) => {
      const [ox, oy] = w2s([0, 0, 0]);
      const [ax, ay] = w2s([vec[0] * axisLen, vec[1] * axisLen, vec[2] * axisLen]);
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ax, ay);
      ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
    };
    drawAxis([1, 0, 0], 'rgba(255,120,120,0.35)');
    drawAxis([0, 1, 0], 'rgba(120,255,120,0.35)');
    drawAxis([0, 0, 1], 'rgba(120,120,255,0.35)');
    tracePath(walk, toScreen);
    ctx.strokeStyle = 'rgba(110,168,254,0.85)'; ctx.lineWidth = 1.2;
    ctx.lineJoin = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd166'; ctx.fill();
    if (S.anim && !S.anim.done) {
      const [px, py] = w2s(walk.pos);
      ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
    }
  }
  function niceGridSpacing(maxR) {
    const candidates = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
    for (const c of candidates) if (maxR / c < 8) return c;
    return 2000;
  }
  function drawOverlay(walk) {
    ctx.font = '12px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(200,207,218,0.75)';
    ctx.fillText('d = ' + walk.d + 'D   N = ' + walk.N, 14, 22);
    ctx.fillText('step ' + walk.stepIdx + ' / ' + walk.N, 14, 40);
    ctx.fillStyle = 'rgba(255,209,102,0.95)';
    ctx.fillText('returns: ' + walk.returns, 14, 58);
  }
  let lastFrameTime = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
    lastFrameTime = now;
    syncCanvas();
    if (!document.getElementById('viewB').hidden && S.anim && !S.anim.done) {
      const rate = RATE_C * S.anim.N / Math.max(2, Math.log(S.anim.N));
      S.stepAcc += dt * rate;
      let guard = 0;
      while (S.stepAcc >= 1 && S.anim && !S.anim.done && guard++ < 200000) {
        advanceWalk(S.anim);
        S.stepAcc -= 1;
      }
      if (S.anim && S.anim.done) {
        S.last = S.anim; S.anim = null; S.stepAcc = 0;
        updateUI();
      } else if (S.anim) {
        updateReadoutRunning(S.anim);
      }
    }
    render();
    requestAnimationFrame(loop);
  }
  document.querySelectorAll('#panelB .dim-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (S.anim) return;
      document.querySelectorAll('#panelB .dim-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      S.d = parseInt(btn.dataset.d, 10);
      S.last = null; updateUI();
    });
  });
  document.getElementById('runBtnB').addEventListener('click', () => {
    if (S.anim) return;
    if (!S.inputValid) return;
    const N = parseN(document.getElementById('nInput').value);
    if (N === null) { applyValidation(); return; }
    S.anim = createWalk(S.d, N);
    S.stepAcc = 0; lastFrameTime = performance.now();
    updateUI();
  });
  document.getElementById('clearBtnB').addEventListener('click', () => {
    if (S.anim) return;
    S.last = null; updateUI();
  });
  const nInputEl = document.getElementById('nInput');
  nInputEl.addEventListener('input', () => {
    const cleaned = nInputEl.value.replace(/[^0-9]/g, '');
    if (cleaned !== nInputEl.value) nInputEl.value = cleaned;
    applyValidation();
  });
  nInputEl.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.length === 1 && !/[0-9]/.test(e.key)) e.preventDefault();
  });
  nInputEl.addEventListener('change', applyValidation);
  function updateUI() {
    const running = !!S.anim;
    document.getElementById('runBtnB').disabled = running || !S.inputValid;
    document.getElementById('clearBtnB').disabled = running;
    document.querySelectorAll('#panelB .dim-btn').forEach(b => b.disabled = running);
    if (running) { updateReadoutRunning(S.anim); }
    else if (!S.inputValid) {
      readoutEl.innerHTML = '<span class="err">Enter a positive integer up to ' + MAX_N.toLocaleString() + '.</span>';
    } else if (S.last) {
      readoutEl.innerHTML = 'Last run: d=' + S.last.d + ', N=' + S.last.N + ', returns=<span class="hl">' + S.last.returns + '</span>';
    } else { readoutEl.textContent = 'Ready.'; }
  }
  function updateReadoutRunning(w) {
    readoutEl.innerHTML = 'Running d=' + w.d + ', N=' + w.N + ' \u00B7 step ' + w.stepIdx + ' / ' + w.N + ' \u00B7 returns=<span class="hl">' + w.returns + '</span>';
  }
  window.addEventListener('resize', syncCanvas);
  syncCanvas(); applyValidation(); updateUI();
  requestAnimationFrame(loop);
})();
</script>

<script>
/* =====================================================
   1C · 2D Self-Avoiding Walk  (pivot algorithm)
   ===================================================== */
(function () {
  const canvas    = document.getElementById('simCanvasC');
  const ctx       = canvas.getContext('2d');
  const readoutEl = document.getElementById('readoutC');
  const MAX_N = 50000;
  const RATE_C = 2;
  const S = { N: 1000, anim: null, last: null, stepAcc: 0, inputValid: true };
  const mcmc = { N: 0, path: null };

  const SYM = [
    (x, y) => [-y,  x],
    (x, y) => [-x, -y],
    (x, y) => [ y, -x],
    (x, y) => [-x,  y],
    (x, y) => [ x, -y],
    (x, y) => [ y,  x],
    (x, y) => [-y, -x],
  ];
  function attemptPivot(path) {
    const N = path.length - 1;
    if (N < 2) return;
    const i = Math.floor(Math.random() * N);
    const sym = SYM[Math.floor(Math.random() * SYM.length)];
    const px = path[i][0], py = path[i][1];
    const occupied = new Set();
    for (let j = 0; j <= i; j++) occupied.add(path[j][0] + ',' + path[j][1]);
    const newSuffix = new Array(N - i);
    for (let j = i + 1; j <= N; j++) {
      const dx = path[j][0] - px;
      const dy = path[j][1] - py;
      const r = sym(dx, dy);
      const nx = px + r[0], ny = py + r[1];
      const key = nx + ',' + ny;
      if (occupied.has(key)) return;
      occupied.add(key);
      newSuffix[j - i - 1] = [nx, ny];
    }
    for (let j = i + 1; j <= N; j++) path[j] = newSuffix[j - i - 1];
  }
  function initWalk(N) {
    const path = new Array(N + 1);
    for (let i = 0; i <= N; i++) path[i] = [i, 0];
    const pivots = Math.max(200, Math.min(5000, 5 * N));
    for (let k = 0; k < pivots; k++) attemptPivot(path);
    return path;
  }
  function sampleWalk(N) {
    if (mcmc.path === null || mcmc.N !== N) {
      mcmc.path = initWalk(N);
      mcmc.N = N;
    } else {
      const pivots = Math.max(50, Math.min(500, Math.floor(N / 2)));
      for (let k = 0; k < pivots; k++) attemptPivot(mcmc.path);
    }
    return mcmc.path.map(p => [p[0], p[1]]);
  }
  function syncCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (cw === 0 || ch === 0) return false;
    const tw = Math.round(cw * dpr), th = Math.round(ch * dpr);
    if (canvas.width !== tw || canvas.height !== th) {
      canvas.width = tw; canvas.height = th;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return true;
  }
  function parseN(raw) {
    const s = String(raw).trim();
    if (s.length === 0) return null;
    const n = parseInt(s, 10);
    if (!Number.isFinite(n)) return null;
    if (n < 1 || n > MAX_N) return null;
    return n;
  }
  function applyValidation() {
    const raw = document.getElementById('cInput').value;
    const n = parseN(raw);
    S.inputValid = (n !== null);
    if (n !== null) S.N = n;
    const runBtn = document.getElementById('runBtnC');
    if (!S.anim) runBtn.disabled = !S.inputValid;
    if (!S.inputValid) {
      readoutEl.innerHTML = '<span class="err">Enter a positive integer up to ' + MAX_N.toLocaleString() + '.</span>';
    } else if (!S.anim) {
      if (S.last) readoutEl.innerHTML = lastRunReadout(S.last);
      else readoutEl.textContent = 'Ready.';
    }
  }
  function lastRunReadout(w) {
    const end = w.path[w.path.length - 1];
    const R = Math.hypot(end[0], end[1]);
    return 'N = ' + w.N +
      ' \u00B7 endpoint (' + end[0] + ', ' + end[1] + ')' +
      ' \u00B7 R = <span class="hl">' + R.toFixed(4) + '</span>';
  }
  function createWalk(N) {
    const path = sampleWalk(N);
    return { N: N, path: path, stepIdx: 0, done: false };
  }
  function advanceWalk(w) {
    if (w.done) return;
    w.stepIdx++;
    if (w.stepIdx >= w.path.length - 1) {
      w.stepIdx = w.path.length - 1;
      w.done = true;
    }
  }
  function render() {
    if (document.getElementById('viewC').hidden) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w === 0 || h === 0) return;
    ctx.clearRect(0, 0, w, h);
    const walk = S.anim || S.last;
    if (!walk) {
      ctx.fillStyle = 'rgba(200,207,218,0.4)';
      ctx.font = '14px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Press Run to begin.', w / 2, h / 2);
      return;
    }
    renderSAW(walk);
    drawOverlay(walk);
  }
  function renderSAW(walk) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const cx = w / 2, cy = h / 2;
    let maxR = 1;
    for (const p of walk.path) {
      const r = Math.hypot(p[0], p[1]);
      if (r > maxR) maxR = r;
    }
    const expected = Math.pow(Math.max(walk.N, 1), 0.75);
    maxR = Math.max(maxR, expected * 0.5) * 1.15;
    const scale = Math.min(w, h) / (2 * maxR);
    const toScreen = (p) => [cx + p[0] * scale, cy - p[1] * scale];
    const spacing = niceGridSpacing(maxR);
    const nGrid = Math.ceil(maxR / spacing) + 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = -nGrid; i <= nGrid; i++) {
      const sx = cx + i * spacing * scale;
      ctx.moveTo(sx, 0); ctx.lineTo(sx, h);
      const sy = cy - i * spacing * scale;
      ctx.moveTo(0, sy); ctx.lineTo(w, sy);
    }
    ctx.stroke();
    const L = Math.min(walk.stepIdx + 1, walk.path.length);
    if (L >= 2) {
      ctx.beginPath();
      const s0 = toScreen(walk.path[0]);
      ctx.moveTo(s0[0], s0[1]);
      for (let i = 1; i < L; i++) {
        const s = toScreen(walk.path[i]);
        ctx.lineTo(s[0], s[1]);
      }
      ctx.strokeStyle = 'rgba(110,168,254,0.95)';
      ctx.lineWidth = 1.4;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd166';
    ctx.fill();
    if (S.anim && !S.anim.done && walk.path.length > 0) {
      const cur = walk.path[Math.min(walk.stepIdx, walk.path.length - 1)];
      const sp = toScreen(cur);
      ctx.beginPath();
      ctx.arc(sp[0], sp[1], 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
    if (walk.done && walk.path.length > 0) {
      const end = walk.path[walk.path.length - 1];
      const se = toScreen(end);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(se[0], se[1]);
      ctx.strokeStyle = 'rgba(255,209,102,0.4)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(se[0], se[1], 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd166';
      ctx.fill();
    }
  }
  function niceGridSpacing(maxR) {
    const candidates = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
    for (const c of candidates) if (maxR / c < 8) return c;
    return 2000;
  }
  function drawOverlay(walk) {
    ctx.font = '12px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(200,207,218,0.75)';
    ctx.fillText('N = ' + walk.N, 14, 22);
    if (!walk.done) {
      ctx.fillText('step ' + walk.stepIdx + ' / ' + walk.N, 14, 40);
    } else {
      const end = walk.path[walk.path.length - 1];
      const R = Math.hypot(end[0], end[1]);
      ctx.fillText('endpoint: (' + end[0] + ', ' + end[1] + ')', 14, 40);
      ctx.fillStyle = 'rgba(255,209,102,0.95)';
      ctx.fillText('R = ' + R.toFixed(4), 14, 58);
    }
  }
  let lastFrameTime = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
    lastFrameTime = now;
    syncCanvas();
    if (!document.getElementById('viewC').hidden && S.anim && !S.anim.done) {
      const rate = RATE_C * S.anim.N / Math.max(2, Math.log(S.anim.N));
      S.stepAcc += dt * rate;
      let guard = 0;
      while (S.stepAcc >= 1 && S.anim && !S.anim.done && guard++ < 200000) {
        advanceWalk(S.anim);
        S.stepAcc -= 1;
      }
      if (S.anim && S.anim.done) {
        S.last = S.anim; S.anim = null; S.stepAcc = 0;
        updateUI();
      } else if (S.anim) {
        updateReadoutRunning(S.anim);
      }
    }
    render();
    requestAnimationFrame(loop);
  }
  document.getElementById('runBtnC').addEventListener('click', () => {
    if (S.anim) return;
    if (!S.inputValid) return;
    const N = parseN(document.getElementById('cInput').value);
    if (N === null) { applyValidation(); return; }
    S.anim = createWalk(N);
    S.stepAcc = 0;
    lastFrameTime = performance.now();
    updateUI();
  });
  document.getElementById('clearBtnC').addEventListener('click', () => {
    if (S.anim) return;
    S.last = null;
    updateUI();
  });
  const cInputEl = document.getElementById('cInput');
  cInputEl.addEventListener('input', () => {
    const cleaned = cInputEl.value.replace(/[^0-9]/g, '');
    if (cleaned !== cInputEl.value) cInputEl.value = cleaned;
    applyValidation();
  });
  cInputEl.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.length === 1 && !/[0-9]/.test(e.key)) e.preventDefault();
  });
  cInputEl.addEventListener('change', applyValidation);
  function updateUI() {
    const running = !!S.anim;
    document.getElementById('runBtnC').disabled = running || !S.inputValid;
    document.getElementById('clearBtnC').disabled = running;
    if (running) {
      updateReadoutRunning(S.anim);
    } else if (!S.inputValid) {
      readoutEl.innerHTML = '<span class="err">Enter a positive integer up to ' + MAX_N.toLocaleString() + '.</span>';
    } else if (S.last) {
      readoutEl.innerHTML = lastRunReadout(S.last);
    } else {
      readoutEl.textContent = 'Ready.';
    }
  }
  function updateReadoutRunning(w) {
    readoutEl.innerHTML = 'Running N = ' + w.N + ' \u00B7 step ' + w.stepIdx + ' / ' + w.N;
  }
  window.addEventListener('resize', syncCanvas);
  syncCanvas();
  applyValidation();
  updateUI();
  requestAnimationFrame(loop);
})();
</script>

<script>
/* =====================================================
   2A · Shadow Length (with two-stage uncertainty)
   ===================================================== */
(function () {
  const hInput  = document.getElementById('hInput2A');
  const readout = document.getElementById('readout2A');

  const ALPHA = 0.785;
  const BETA  = 0.546;
  const ARM   = 7.15;
  const R     = 3.20;

  const H_NOISE = 0.05;
  const L_NOISE = 0.10;

  const SIN_A = Math.sin(ALPHA);
  const COS_A = Math.cos(ALPHA);
  const TAN_A = Math.tan(ALPHA);
  const COS_B = Math.cos(BETA);
  const TAN_B = Math.tan(BETA);

  const T1 = ARM + R * (1 - SIN_A);
  const T2 = ARM + R * (1 - Math.sin(BETA));
  const T3 = ARM + R + R * (COS_A - COS_B) / Math.sin(BETA - ALPHA);

  function computeL(h) {
    if (h < T1) {
      return 2 * R / COS_A;
    } else if (h < T2) {
      const d = h - R - ARM;
      return R / COS_A - d * TAN_A + Math.sqrt(R * R - d * d);
    } else if (h < T3) {
      const d = h - R - ARM;
      return R / COS_A + R / COS_B + d * (TAN_B - TAN_A);
    } else {
      return 2 * R / COS_B;
    }
  }

  function uniform(min, max) {
    return min + Math.random() * (max - min);
  }

  function parseFloatInRange(raw, min, max) {
    const s = String(raw).trim();
    if (!/^\d*\.?\d*$/.test(s) || s === '' || s === '.') return null;
    const n = parseFloat(s);
    if (!Number.isFinite(n)) return null;
    if (n < min || n > max) return null;
    return n;
  }

  hInput.addEventListener('input', () => {
    let s = hInput.value.replace(/[^0-9.]/g, '');
    const firstDot = s.indexOf('.');
    if (firstDot !== -1) {
      s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, '');
    }
    if (s !== hInput.value) hInput.value = s;
  });
  hInput.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.length === 1 && !/[0-9.]/.test(e.key)) e.preventDefault();
  });

  function showError(msg) {
    readout.innerHTML = '<span class="err">' + msg + '</span>';
  }

  document.getElementById('runBtn2A').addEventListener('click', () => {
    const h = parseFloatInRange(hInput.value, 0, 15);
    if (h === null) { showError('Height must be a number between 0 and 15 cm.'); return; }

    const hMeasured = h + uniform(-H_NOISE, H_NOISE);
    const LTrue = computeL(hMeasured);
    const LMeasured = LTrue + uniform(-L_NOISE, L_NOISE);

    readout.innerHTML =
      'h = ' + h.toFixed(2) + ' cm<br>' +
      'L = <span class="value">' + LMeasured.toFixed(2) + '</span> cm';
  });
})();
</script>

<script>
/* =====================================================
   2B · Shadow Area (black box)
   =====================================================
   Exact y-bounds per x-column, discretised along x.
   Clips to the [-100, 100]^2 sheet automatically.
   ===================================================== */
(function () {
  const xInput  = document.getElementById('xInput2B');
  const yInput  = document.getElementById('yInput2B');
  const zInput  = document.getElementById('zInput2B');
  const readout = document.getElementById('readout2B');

  /* ---- Hidden truth (never shown to student) ---- */
  const sx = 32;
  const sy = 41;
  const sz = 139;
  const r  = 17;

  /* ---- Position uncertainty (cm) on the sphere center ---- */
  const POS_NOISE = 0.05;

  /* ---- Ground plane bounds ---- */
  const HALF = 100;
  const NX   = 10000;   // x-columns per query

  function uniform(min, max) {
    return min + Math.random() * (max - min);
  }

  /* ---- Exact shadow area on z = 0, clipped to the sheet ----
     For each x-column, the shadow is the y-interval between the
     two real roots of the tangent-cone equation. Columns whose
     discriminant is negative (or which fall off the sheet) are
     skipped. The interval is clipped to [-HALF, HALF] before
     contributing to the area. */
  function shadowArea(cx, cy, cz) {
    const wx = cx - sx;
    const wy = cy - sy;
    const D  = sz - cz;                    // source-to-sphere z-distance
    if (D <= 0) return 0;

    const r2 = r * r;
    const D2 = D * D;

    // Quadratic form coefficients of the shadow ellipse (in shifted
    // coordinates X = x - sx, Y = y - sy on the plane z = 0):
    //   Pxx X^2 + Pyy Y^2 + 2 Pxy X Y + Lx X + Ly Y + C0 = 0
    const Pxx = D2 + wy * wy - r2;
    const Pyy = D2 + wx * wx - r2;
    const Pxy = -wx * wy;
    const Lx  = -2 * sz * D * wx;
    const Ly  = -2 * sz * D * wy;
    const C0  = sz * sz * (wx * wx + wy * wy - r2);

    if (Pyy <= 0) return 0;                // safety; not reachable in-range

    const dx = (2 * HALF) / NX;
    const inv2Pyy = 1 / (2 * Pyy);

    let area = 0;

    for (let i = 0; i < NX; i++) {
      const x = -HALF + (i + 0.5) * dx;
      const X = x - sx;

      const B1 = 2 * Pxy * X + Ly;
      const C1 = (Pxx * X + Lx) * X + C0;

      const disc = B1 * B1 - 4 * Pyy * C1;
      if (disc <= 0) continue;

      const sq = Math.sqrt(disc);
      let yA = sy + (-B1 - sq) * inv2Pyy;
      let yB = sy + (-B1 + sq) * inv2Pyy;
      if (yA > yB) { const t = yA; yA = yB; yB = t; }

      if (yA < -HALF) yA = -HALF;
      if (yB >  HALF) yB =  HALF;
      if (yB > yA) area += (yB - yA) * dx;
    }
    return area;
  }

  /* ---- Input handling (allow negative numbers) ---- */
  function attachSignedFloatFilter(el) {
    el.addEventListener('input', () => {
      let s = el.value.replace(/[^0-9.\-]/g, '');
      if (s.startsWith('-')) s = '-' + s.slice(1).replace(/-/g, '');
      else                   s = s.replace(/-/g, '');
      const dot = s.indexOf('.');
      if (dot !== -1) s = s.slice(0, dot + 1) + s.slice(dot + 1).replace(/\./g, '');
      if (s !== el.value) el.value = s;
    });
    el.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Enter') {
        document.getElementById('runBtn2B').click();
        return;
      }
      if (e.key.length === 1 && !/[0-9.\-]/.test(e.key)) e.preventDefault();
    });
  }
  attachSignedFloatFilter(xInput);
  attachSignedFloatFilter(yInput);
  attachSignedFloatFilter(zInput);

  function parseFree(raw) {
    const s = String(raw).trim();
    if (s === '' || s === '-' || s === '.' || s === '-.') return null;
    const n = parseFloat(s);
    if (!Number.isFinite(n)) return null;
    return n;
  }

  function showError(msg) {
    readout.innerHTML = '<span class="err">' + msg + '</span>';
  }

  /* ---- Handler ---- */
  document.getElementById('runBtn2B').addEventListener('click', () => {
    const cx = parseFree(xInput.value);
    const cy = parseFree(yInput.value);
    const cz = parseFree(zInput.value);

    if (cx === null || cy === null || cz === null) {
      showError('x, y, z must be valid numbers.'); return;
    }
    if (cz <= 20 || cz >= 80) {
      showError('z must satisfy 20 < z < 80 cm.'); return;
    }

    // Stage 1: the sphere is placed with positioning error.
    const cxA = cx + uniform(-POS_NOISE, POS_NOISE);
    const cyA = cy + uniform(-POS_NOISE, POS_NOISE);
    const czA = cz + uniform(-POS_NOISE, POS_NOISE);

    // Stage 2: exact shadow area at the actual position, clipped to the sheet.
    const A = shadowArea(cxA, cyA, czA);

    readout.innerHTML =
      'Shadow area = <span class="value">' + A.toFixed(2) + '</span> cm²';
  });
})();
</script>
