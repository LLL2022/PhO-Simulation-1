<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Part A · 2D Random Walk</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1117;
    color: #e8eaf0;
  }

  body { display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- Header ---------- */
  header {
    border-bottom: 1px solid #2a2f3a;
    flex-shrink: 0;
    padding: 0.85rem 1.25rem;
    display: flex;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  header .sub {
    font-family: ui-monospace, monospace;
    font-size: 0.78rem;
    color: #8b93a1;
  }

  /* ---------- Main ---------- */
  main {
    display: grid;
    grid-template-columns: 1fr 340px;
    flex: 1;
    min-height: 0;
  }

  .canvas-wrap {
    position: relative;
    background: #0b0d12;
    border-right: 1px solid #2a2f3a;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;   /* so panning works on touch */
  }
  canvas.dragging { cursor: grabbing; }

  /* ---------- Tooltip ---------- */
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(15, 17, 23, 0.96);
    border: 1px solid #3b6ea5;
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    font-family: ui-monospace, monospace;
    font-size: 0.78rem;
    color: #e8eaf0;
    line-height: 1.5;
    display: none;
    z-index: 10;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .tooltip-title { color: #6ea8fe; margin-bottom: 2px; }
  .tooltip .hl { color: #ffd166; }

  /* ---------- Panel ---------- */
  .panel {
    padding: 1rem 1.15rem 2rem;
    overflow-y: auto;
    background: #151922;
    display: flex;
    flex-direction: column;
  }

  .panel button {
    padding: 0.5rem 0.9rem;
    border-radius: 6px;
    border: 1px solid #3b4252;
    background: #1f2530;
    color: #c8cfda;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .panel button:hover { background: #2a3140; }
  .panel button.primary {
    background: #1f3a5f;
    border-color: #3b6ea5;
    color: #cfe3ff;
  }
  .panel button.primary:hover { background: #264a78; }

  .control-row { display: flex; gap: 0.5rem; margin-top: 0.3rem; }
  .control-row button { flex: 1; }

  .readout {
    margin-top: 1rem;
    font-family: ui-monospace, monospace;
    font-size: 0.85rem;
    color: #9aa4b2;
    line-height: 1.8;
  }
  .readout .hl { color: #ffd166; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
    .canvas-wrap { border-right: none; border-bottom: 1px solid #2a2f3a; }
  }
</style>
</head>
<body>

<header>
  <h1>Part A · 2D Random Walk</h1>
</header>

<main>
  <section class="canvas-wrap">
    <canvas id="simCanvas"></canvas>
    <div id="tooltip" class="tooltip"></div>
  </section>

  <aside class="panel">
    <div class="control-row">
      <button id="runBtn" class="primary">New Run</button>
      <button id="clearBtn">Clear All</button>
    </div>
    <div class="control-row">
      <button id="recenterBtn">Recenter View</button>
    </div>

    <div class="readout">
      Runs completed: <span class="hl" id="runCount">0</span><br>
      <span id="liveText">Click "New Run" to begin.</span>
    </div>
  </aside>
</main>

<script>
/* =====================================================
   Part A · 2D Random Walk  ·  single particle
   Internal constants are hidden from the UI on purpose.
   ===================================================== */

const canvas  = document.getElementById('simCanvas');
const ctx     = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

const COLORS = [
  '#6ea8fe', '#8bc9a0', '#ffd166', '#e88b8b', '#c8a2ff',
  '#7fd4d4', '#f0a860', '#a0d860', '#d47fb8', '#8fa0e8',
];

/* ---- internal physics constants (not shown to the student) ---- */
const PHYS = {
  v: 4.11,
  dt: 0.01,   // s
  T: 10,      // s per run
};

const S = {
  runs: [],
  current: null,
  acc: 0,
  running: false,
  hover: null,
};

/* ---------- View transform ---------- */
/* panX, panY are screen-pixel offsets applied on top of (cx, cy).
   Positive panX shifts the world to the right; positive panY shifts it down. */
const view = { cx: 0, cy: 0, scale: 50, panX: 0, panY: 0 };

function fitCanvas() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.max(1, Math.round(r.width  * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  updateView();
}

function updateView() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  view.cx = w / 2;
  view.cy = h / 2;
  view.scale = Math.min(w, h) / 4;   // 4 world-units across the shorter side
}

function w2s(x, y) {
  return [
    view.cx + x * view.scale + view.panX,
    view.cy - y * view.scale + view.panY,
  ];
}

function s2w(sx, sy) {
  return [
    (sx - view.cx - view.panX) / view.scale,
    (view.cy + view.panY - sy) / view.scale,
  ];
}

/* ---------- Run lifecycle ---------- */
function newRun() {
  const id = S.runs.length + 1;
  S.current = {
    id,
    color: COLORS[(id - 1) % COLORS.length],
    t: 0,
    steps: 0,
    x: 0,
    y: 0,
    path: [[0, 0]],
    markers: [{ t: 0, x: 0, y: 0 }],
    done: false,
  };
  S.acc = 0;
  S.running = true;
  updateLiveReadout();
  updateRunButton();
}

function stepOnce() {
  const c = S.current;
  if (!c) return;

  c.steps += 1;
  const th = Math.random() * Math.PI * 2;
  c.x += PHYS.v * PHYS.dt * Math.cos(th);
  c.y += PHYS.v * PHYS.dt * Math.sin(th);
  c.path.push([c.x, c.y]);

  const tNow = c.steps * PHYS.dt;
  c.t = tNow;

  const nextSec = c.markers.length;
  if (nextSec <= PHYS.T && tNow + 1e-9 >= nextSec) {
    c.markers.push({ t: nextSec, x: c.x, y: c.y });
  }

  if (tNow + 1e-9 >= PHYS.T) {
    c.t = PHYS.T;
    c.done = true;
    S.runs.push(c);
    S.current = null;
    S.running = false;
    updateRunButton();
    updateLiveReadout();
  }
}

/* ---------- Main loop (real time) ---------- */
let lastFrame = performance.now();

function loop(now) {
  const dtReal = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;

  if (S.running && S.current) {
    S.acc += dtReal;
    let guard = 0;
    while (S.acc >= PHYS.dt && S.current && guard++ < 20000) {
      stepOnce();
      S.acc -= PHYS.dt;
    }
    const tEl = document.getElementById('tNow');
    if (tEl && S.current) tEl.textContent = S.current.t.toFixed(2);
  }

  render();
  requestAnimationFrame(loop);
}

/* =====================================================
   Rendering
   ===================================================== */
function render() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  drawGrid();
  drawAllRuns();
  drawOrigin();
  drawHoverRing();
  drawOverlay();
}

function drawGrid() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  const step = 0.5;

  const [xMinW, yMaxW] = s2w(0, 0);
  const [xMaxW, yMinW] = s2w(w, h);

  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();

  const xStart = Math.floor(xMinW / step) * step;
  for (let x = xStart; x <= xMaxW + 1e-9; x += step) {
    const [sx] = w2s(x, 0);
    ctx.moveTo(sx, 0);
    ctx.lineTo(sx, h);
  }
  const yStart = Math.floor(yMinW / step) * step;
  for (let y = yStart; y <= yMaxW + 1e-9; y += step) {
    const [, sy] = w2s(0, y);
    ctx.moveTo(0, sy);
    ctx.lineTo(w, sy);
  }
  ctx.stroke();
}

function drawAllRuns() {
  for (let i = 0; i < S.runs.length - 1; i++) {
    drawRunPath(S.runs[i], 0.18);
  }
  if (S.runs.length > 0) {
    const last = S.runs[S.runs.length - 1];
    drawRunPath(last, 0.55);
    drawRunMarkers(last, 3.5);
  }
  if (S.current) {
    drawRunPath(S.current, 1.0);
    drawRunMarkers(S.current, 4.5);
  }
}

function drawRunPath(run, alpha) {
  if (run.path.length < 2) return;
  ctx.beginPath();
  const [sx0, sy0] = w2s(run.path[0][0], run.path[0][1]);
  ctx.moveTo(sx0, sy0);
  for (let i = 1; i < run.path.length; i++) {
    const [sx, sy] = w2s(run.path[i][0], run.path[i][1]);
    ctx.lineTo(sx, sy);
  }
  ctx.strokeStyle = hexWithAlpha(run.color, alpha);
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function drawRunMarkers(run, r) {
  for (const m of run.markers) {
    const [sx, sy] = w2s(m.x, m.y);
    ctx.beginPath();
    ctx.arc(sx, sy, m.t === 0 ? r + 1.5 : r, 0, Math.PI * 2);
    ctx.fillStyle = m.t === 0 ? '#ffd166' : run.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawOrigin() {
  const [ox, oy] = w2s(0, 0);
  ctx.beginPath();
  ctx.arc(ox, oy, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd166';
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,209,102,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ox - 8, oy);
  ctx.lineTo(ox + 8, oy);
  ctx.moveTo(ox, oy - 8);
  ctx.lineTo(ox, oy + 8);
  ctx.stroke();
}

function drawHoverRing() {
  if (!S.hover) return;
  const [sx, sy] = w2s(S.hover.x, S.hover.y);
  ctx.beginPath();
  ctx.arc(sx, sy, 9, 0, Math.PI * 2);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawOverlay() {
  ctx.font = '12px ui-monospace, monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(200,207,218,0.75)';
  ctx.fillText('Runs completed: ' + S.runs.length, 14, 22);
  if (S.current) {
    ctx.fillStyle = 'rgba(255,209,102,0.9)';
    ctx.fillText('t = ' + S.current.t.toFixed(2) + ' s', 14, 42);
  }
}

function hexWithAlpha(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

/* =====================================================
   Pointer: pan + hover
   ===================================================== */
let dragging = false;
let dragStartX = 0, dragStartY = 0;
let panStartX = 0, panStartY = 0;
let movedDuringDrag = false;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  movedDuringDrag = false;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  panStartX = view.panX;
  panStartY = view.panY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (dragging) {
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) + Math.abs(dy) > 3) movedDuringDrag = true;
    view.panX = panStartX + dx;
    view.panY = panStartY + dy;
    // hide tooltip while dragging
    S.hover = null;
    tooltip.style.display = 'none';
    return;
  }

  // hover detection
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const hoverable = [];
  if (S.current) hoverable.push(S.current);
  if (S.runs.length > 0) hoverable.push(S.runs[S.runs.length - 1]);

  let best = null;
  let bestDist = 16;

  for (const run of hoverable) {
    for (const m of run.markers) {
      const [sx, sy] = w2s(m.x, m.y);
      const d = Math.hypot(sx - mx, sy - my);
      if (d < bestDist) {
        bestDist = d;
        best = { ...m, runId: run.id, sx, sy };
      }
    }
  }

  S.hover = best;
  updateTooltip();
});

canvas.addEventListener('pointerup', (e) => {
  dragging = false;
  canvas.classList.remove('dragging');
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});

canvas.addEventListener('pointercancel', () => {
  dragging = false;
  canvas.classList.remove('dragging');
});

canvas.addEventListener('pointerleave', () => {
  if (dragging) return;
  S.hover = null;
  updateTooltip();
});

function updateTooltip() {
  if (!S.hover) {
    tooltip.style.display = 'none';
    return;
  }
  tooltip.style.display = 'block';
  tooltip.style.left = (S.hover.sx + 14) + 'px';
  tooltip.style.top  = (S.hover.sy + 10) + 'px';
  tooltip.innerHTML =
    '<div class="tooltip-title">Run ' + S.hover.runId + ' \u00B7 t = ' + S.hover.t + ' s</div>' +
    '<div>x = <span class="hl">' + S.hover.x.toFixed(4) + '</span></div>' +
    '<div>y = <span class="hl">' + S.hover.y.toFixed(4) + '</span></div>';
}

/* =====================================================
   Panel wiring
   ===================================================== */
function bindPanel() {
  document.getElementById('runBtn').addEventListener('click', () => {
    if (S.running && S.current) {
      S.running = false;
      updateRunButton();
    } else if (S.current && !S.current.done) {
      S.running = true;
      updateRunButton();
    } else {
      newRun();
      updateRunButton();
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    S.runs = [];
    S.current = null;
    S.running = false;
    S.hover = null;
    tooltip.style.display = 'none';
    updateRunButton();
    updateLiveReadout();
  });

  document.getElementById('recenterBtn').addEventListener('click', () => {
    view.panX = 0;
    view.panY = 0;
  });
}

function updateRunButton() {
  const b = document.getElementById('runBtn');
  if (!b) return;
  if (S.running && S.current) b.textContent = 'Pause';
  else if (S.current && !S.current.done) b.textContent = 'Continue';
  else b.textContent = 'New Run';
}

function updateLiveReadout() {
  const rc = document.getElementById('runCount');
  if (rc) rc.textContent = S.runs.length;

  const live = document.getElementById('liveText');
  if (!live) return;

  if (S.current) {
    live.innerHTML = 'Current run ' + S.current.id +
      ': t = <span class="hl" id="tNow">' + S.current.t.toFixed(2) + '</span> s';
  } else if (S.runs.length === 0) {
    live.textContent = 'Click "New Run" to begin.';
  } else {
    live.textContent = 'Latest: run #' + S.runs.length + ' complete.';
  }
}

/* =====================================================
   Init
   ===================================================== */
window.addEventListener('resize', fitCanvas);

fitCanvas();
bindPanel();
updateLiveReadout();
requestAnimationFrame(loop);
</script>
</body>
</html>
